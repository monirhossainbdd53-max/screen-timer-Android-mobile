name: Build & Publish Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Screen Time Tracker APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK file
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/ScreenTimeTracker.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeTracker-APK
          path: release-apk/ScreenTimeTracker.apk

      - name: Publish APK to GitHub Releases (Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/ScreenTimeTracker.apk
          generate_release_notes: true

      - name: Publish APK to GitHub Releases (Latest)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "স্ক্রিন টাইম ট্র্যাকার (সর্বশেষ APK)"
          body: |
            ফোনে সরাসরি ইনস্টল করার জন্য নিচের **ScreenTimeTracker.apk** ফাইলটি ডাউনলোড করুন।
            - সম্পূর্ণ অফলাইন (কোনো ইন্টারনেট অনুমতি নেই)
            - Android 8.0+ (Symphony Z42 / Android 11 পরীক্ষিত)
          files: release-apk/ScreenTimeTracker.apk
          make_latest: true
